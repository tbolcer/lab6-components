<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example HTML</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            background: #ccccff;
        }

        chat-window {
            display: flex;
            flex-direction: column;
            margin: auto;
            width: 400px;
            height: 600px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            justify-content: center;
            border-radius: 1rem;
            margin-top: 3rem;
            padding: 1rem;
            background-color: white;
        }

        /* header that visually fills the top and sides of the chat-window */
        chat-header {
            display: flex;
            justify-content: space-between;
            flex-direction: column;
            align-items: center;
            /* expand to container edges: chat-window has 1rem padding, so offset by that */
            margin: -1rem -1rem 0 -1rem; /* top, right, bottom, left */
            padding: 1.5rem 1rem;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            margin-bottom: 0.75rem;
            background-color: #007bff;
            color: white;
            /* match the chat-window top corner radius */
            border-top-left-radius: 1rem;
            border-top-right-radius: 1rem;
            /* make header paint above the messages so scrolling content doesn't cover it */
            position: relative;
            z-index: 5;
        }

        /* header text styles */
        chat-header #p1 {
            padding-top: 1.5rem;
            margin: 0;
            font-size: 2rem;
            color: white;
            font-weight: 600;
            text-align: center;
        }

        /* the scrolling message area (fills available height and scrolls internally) */
        chat-messages {
            flex: 1 1 auto;
            overflow-y: auto;
            padding-bottom: 10px; /* spacing above input */
            /* ensure messages don't create their own opaque background over header */
            background: transparent;
        }

        /* message wrapper and bubble styles */
        .message {
            display: flex;
            margin: 6px 0;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 14px;
            line-height: 1.3;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
            /* allow long text to wrap and expand bubble height */
            white-space: pre-wrap; /* preserve newlines but wrap long lines */
            overflow-wrap: break-word;
            word-break: break-word;
            overflow: visible;
        }

        .message.user .bubble {
            background: #007bff;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .bubble {
            background: #f1f1f1;
            color: #222;
            border-bottom-left-radius: 4px;
        }

        /* input area pinned to bottom of chat-window */
        input-area {
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid #eee;
            padding-top: 8px;
            flex: 0 0 auto;
            background: transparent;
        }

        input-area textarea {
            display: flex; /* predictable caret behavior */
            resize: none;
            width: 100%;
            min-height: 40px;
            max-height: 120px;
            box-sizing: border-box;
            border-radius: 5rem;
            text-align: left;
            align-items: center;
            padding-left: 1em;
            padding-top: 1em;
        }

        #sendBtn {
            padding: 8px 16px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5rem;
        }

    </style>
    <script type="module">
        const DEBUG = true;

        function log(msg) {
            if (DEBUG) {
                console.log(msg);
            }
        }

        function showResponse(response) {
            addToChatWindow(response, 'bot');
        }

        function getResponse(message) {
            return 'OH Thats interesting!';
        }

        function processMessage(message) {
            let response = message;

            showResponse(response);
        }

        function send() {
            log('Sending message!');

            let messageBox = document.getElementById('messageBox');
            let message = messageBox.value.trim();

            if (!message) return; // don't send empty messages

            messageBox.value = '';
            messageBox.focus();

            addToChatWindow(message, 'user');
            processMessage(message);
        }

        function addToChatWindow(message, speaker) {
            let messages = document.getElementById('messages');

            // message wrapper
            const wrapper = document.createElement('chat-messages');
            wrapper.className = `message ${speaker}`;

            // bubble
            const bubble = document.createElement('chat-messages');
            bubble.className = 'bubble';
            bubble.textContent = message;

            wrapper.appendChild(bubble);
            messages.appendChild(wrapper);

            // auto-scroll to bottom
            messages.scrollTop = messages.scrollHeight;
        }

        function init() {
            log('Loading app!');

            document.getElementById('sendBtn').addEventListener('click', function () {
                send();
            });

            // allow Enter to send (Shift+Enter for newline)
            const messageBox = document.getElementById('messageBox');
            messageBox.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    send();
                }
            });
        }

        window.addEventListener('DOMContentLoaded', init);

    </script>

</head>

    <body>

    <chat-window id="chatWindow">
        <chat-header>
            <p id="p1">Chat Assistant</p>
            <p id="p2">Model 3: Html/JS/CSS Model</p>
        </chat-header>

        <chat-messages id="messages">
            <!-- messages will be appended here -->
        </chat-messages>

        <input-area>
            <textarea placeholder="Type a message..." rows="2" id="messageBox"></textarea>
            <button id="sendBtn" type="button">Send</button>
        </input-area>
    </chat-window>

</body>
</html>
